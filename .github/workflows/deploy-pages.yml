name: Deploy PM Cockpit

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Daily Macro Report"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build PM Cockpit
        run: |
          python scripts/build_pm_site.py

      - name: Gate public historical reliability
        run: |
          python scripts/audit_public_historical_reliability.py --site-dir _site
          python -m unittest tests/test_public_historical_reliability.py

      - name: Gate historical PM V2 reconstruction
        run: |
          python scripts/audit_historical_pm_v2_reconstruction.py --site-dir _site
          python -m unittest tests/test_historical_pm_v2_reconstruction.py

      - name: Gate fixed-template historical PM V2 UI parity
        run: |
          python scripts/audit_historical_pm_v2_ui_parity.py --site-dir _site
          python -m unittest tests/test_historical_pm_v2_ui_parity.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
